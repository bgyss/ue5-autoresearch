[tools]
python = "3.12"
uv = "0.6"

[env]
# Point mise at the uv-managed venv.
_.python.venv = ".venv"

# Override these to point propose.py at your local LLM server.
# LLM_BASE_URL = "http://localhost:8080/v1"
# LLM_MODEL = ""
# LLM_API_KEY = ""

[tasks]
sync = "uv sync"
lint = "uv run ruff check harness"
fmt = "uv run ruff format harness"
eval = "uv run python harness/evaluate.py"
demo = "uv run python harness/evaluate.py --mock"
propose = "uv run python harness/propose.py --iterations 50"
